<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>WheelMaker</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; grid-template-rows: 32px minmax(0, 1fr); background: #111318; color: #f5f7fb; }
    body.android-bootstrap { grid-template-rows: minmax(0, 1fr); }
    #titlebar { display: flex; align-items: stretch; justify-content: space-between; background: #1b1f27; border-bottom: 1px solid #303540; user-select: none; }
    .title { display: flex; min-width: 0; align-items: center; padding: 0 12px; color: #f5f7fb; font-size: 12px; font-weight: 600; }
    .window-controls { display: inline-flex; align-items: stretch; }
    .window-control { width: 46px; padding: 0; border: 0; border-radius: 0; background: transparent; color: #c9d1df; font: inherit; font-size: 16px; font-weight: 400; cursor: pointer; }
    .window-control:hover { background: #303846; color: #ffffff; }
    .window-control.close:hover { background: #c42b1c; color: #ffffff; }
    main { width: min(30rem, calc(100% - 2rem)); align-self: center; justify-self: center; padding: 2rem; border: 1px solid #303540; border-radius: 1rem; background: #1a1e25; }
    h1 { margin: 0 0 .5rem; font-size: 1.6rem; }
    p { margin: 0 0 1.25rem; color: #aeb6c5; line-height: 1.5; }
    label { display: block; margin-bottom: .5rem; font-weight: 600; }
    input { width: 100%; padding: .8rem; border: 1px solid #465064; border-radius: .55rem; background: #101319; color: inherit; }
    .mode-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
    .mode-card { min-height: 5rem; text-align: left; }
    .mode-card span { display: block; margin-top: .3rem; color: #667085; font-size: .82rem; font-weight: 500; }
    .actions { display: flex; flex-wrap: wrap; gap: .65rem; margin-top: 1rem; }
    button { padding: .7rem 1rem; border: 0; border-radius: .55rem; background: #e4ebff; color: #111318; font-weight: 700; cursor: pointer; }
    button.secondary { background: #313846; color: #f5f7fb; }
    button:disabled { opacity: .55; cursor: wait; }
    #error { min-height: 1.4rem; margin-top: 1rem; color: #ff9d9d; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header id="titlebar">
    <span class="title">WheelMaker</span>
    <div id="window-controls" class="window-controls" hidden>
      <button id="minimize" class="window-control" type="button" aria-label="Minimize" title="Minimize">−</button>
      <button id="maximize" class="window-control" type="button" aria-label="Maximize or restore" title="Maximize or restore">□</button>
      <button id="close" class="window-control close" type="button" aria-label="Close" title="Close">×</button>
    </div>
  </header>
  <main>
    <h1>Connect to WheelMaker</h1>
    <p id="instructions">Choose how this Desktop connects.</p>
    <div id="connection-modes" class="mode-grid" hidden>
      <button id="gateway-mode" class="mode-card" type="button">Gateway<span>Connect through an HTTPS address.</span></button>
      <button id="localhost-mode" class="mode-card secondary" type="button">Localhost<span>Connect to Registry on this PC.</span></button>
    </div>
    <form id="form" hidden>
      <label for="base-url">Server address</label>
      <input id="base-url" name="baseUrl" type="text" inputmode="url" autocomplete="url" placeholder="example.com" required>
      <div class="actions">
        <button id="save" type="submit">Connect</button>
      </div>
    </form>
    <section id="localhost-panel" hidden>
      <p>WheelMaker Desktop will use the Registry running on this PC.</p>
    </section>
    <div class="actions">
      <button id="retry" class="secondary" type="button" hidden>Retry</button>
      <button id="reset" class="secondary" type="button" hidden>Change connection</button>
    </div>
    <div id="error" role="alert" aria-live="polite"></div>
  </main>
  <script>
    const form = document.getElementById('form');
    const instructions = document.getElementById('instructions');
    const connectionModes = document.getElementById('connection-modes');
    const gatewayMode = document.getElementById('gateway-mode');
    const localhostMode = document.getElementById('localhost-mode');
    const localhostPanel = document.getElementById('localhost-panel');
    const input = document.getElementById('base-url');
    const save = document.getElementById('save');
    const retry = document.getElementById('retry');
    const reset = document.getElementById('reset');
    const error = document.getElementById('error');
    const titlebar = document.getElementById('titlebar');
    const windowControls = document.getElementById('window-controls');
    const minimize = document.getElementById('minimize');
    const maximize = document.getElementById('maximize');
    const close = document.getElementById('close');
    const pending = new Map();
    const BRIDGE_TIMEOUT_MS = 30_000;
    let fallbackRequestSequence = 0;
    const hasDesktopWindowControls = typeof window.wheelMakerBootstrap?.startDrag === 'function';
    const supportsLocalhost = typeof window.wheelMakerBootstrap?.selectLocalhost === 'function';
    let currentState = {};

    windowControls.hidden = !hasDesktopWindowControls;
    document.body.classList.toggle('android-bootstrap', !hasDesktopWindowControls);
    titlebar.hidden = !hasDesktopWindowControls;

    if (typeof window.wheelMakerBootstrap?.postMessage === 'function') {
      window.wheelMakerBootstrap.onmessage = event => {
        let response;
        try { response = JSON.parse(event.data); } catch (_) { return; }
        const request = pending.get(response.requestId);
        if (!request) return;
        pending.delete(response.requestId);
        window.clearTimeout(request.timeout);
        response.ok ? request.resolve(response.result) : request.reject(new Error(response.error || 'Native request failed.'));
      };
    }

    function newRequestId() {
      return crypto.randomUUID?.() ||
        `wm-${Date.now().toString(36)}-${(++fallbackRequestSequence).toString(36)}`;
    }

    function callBootstrap(action, payload = {}) {
      const bridge = window.wheelMakerBootstrap;
      if (typeof bridge?.postMessage === 'function') {
        return new Promise((resolve, reject) => {
          const requestId = newRequestId();
          const timeout = window.setTimeout(() => {
            pending.delete(requestId);
            reject(new Error('Native request timed out.'));
          }, BRIDGE_TIMEOUT_MS);
          pending.set(requestId, {resolve, reject, timeout});
          try {
            bridge.postMessage(JSON.stringify({requestId, action, payload}));
          } catch (requestError) {
            pending.delete(requestId);
            window.clearTimeout(timeout);
            reject(requestError);
          }
        });
      }
      if (action === 'bootstrap.getState') return bridge.getState();
      if (action === 'bootstrap.saveBaseUrl') return bridge.saveBaseUrl(payload.baseUrl);
      if (action === 'bootstrap.selectLocalhost') return bridge.selectLocalhost();
      if (action === 'bootstrap.retry') return bridge.retry();
      if (action === 'bootstrap.reset') return bridge.reset();
      throw new Error('Unsupported bootstrap action.');
    }

    function callWindow(action) {
      const bridge = window.wheelMakerBootstrap;
      if (!hasDesktopWindowControls || typeof bridge?.[action] !== 'function') return Promise.resolve();
      return bridge[action]();
    }

    function render(state) {
      currentState = state;
      const mode = supportsLocalhost ? (state.connectionMode || '') : 'gateway';
      input.value = state.baseUrl || '';
      error.textContent = state.error || '';
      instructions.textContent = mode === 'gateway'
        ? 'Enter the HTTPS address of your WheelMaker server.'
        : mode === 'localhost'
          ? 'Connect to WheelMaker services running on this PC.'
          : 'Choose how this Desktop connects.';
      connectionModes.hidden = !supportsLocalhost || mode !== '';
      form.hidden = mode !== 'gateway';
      localhostPanel.hidden = mode !== 'localhost';
      retry.hidden = !state.error || mode === '';
      reset.hidden = mode === '';
      save.disabled = Boolean(state.busy);
      localhostMode.disabled = Boolean(state.busy);
      retry.disabled = Boolean(state.busy);
      reset.disabled = Boolean(state.busy);
    }

    async function runBootstrapAction(action, payload = {}, button = null) {
      if (button) button.disabled = true;
      try {
        render(await callBootstrap(action, payload));
      } catch (requestError) {
        error.textContent = requestError instanceof Error ? requestError.message : String(requestError);
      } finally {
        if (button) button.disabled = false;
      }
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      await runBootstrapAction('bootstrap.saveBaseUrl', {baseUrl: input.value}, save);
    });
    gatewayMode.addEventListener('click', () => render({...currentState, connectionMode: 'gateway', error: ''}));
    localhostMode.addEventListener('click', () => void runBootstrapAction('bootstrap.selectLocalhost', {}, localhostMode));
    retry.addEventListener('click', () => void runBootstrapAction('bootstrap.retry', {}, retry));
    reset.addEventListener('click', () => void runBootstrapAction('bootstrap.reset', {}, reset));
    titlebar.addEventListener('mousedown', event => {
      if (!hasDesktopWindowControls) return;
      if (event.button !== 0 || (event.target instanceof Element && event.target.closest('button'))) return;
      event.preventDefault();
      void callWindow('startDrag');
    });
    titlebar.addEventListener('dblclick', event => {
      if (!hasDesktopWindowControls) return;
      if (event.target instanceof Element && event.target.closest('button')) return;
      void callWindow('toggleMaximize');
    });
    minimize.addEventListener('click', () => void callWindow('minimize'));
    maximize.addEventListener('click', () => void callWindow('toggleMaximize'));
    close.addEventListener('click', () => void callWindow('close'));
    window.addEventListener('DOMContentLoaded', async () => {
      await Promise.resolve(window.wheelMakerBootstrap?.ready);
      await runBootstrapAction('bootstrap.getState');
    });
  </script>
</body>
</html>
