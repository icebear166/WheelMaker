title = "WheelMaker credential leak policy"

[extend]
useDefault = true

[[allowlists]]
description = "Generated release outputs and dependency/compiler caches"
paths = [
  '''^\.release-out([\\/]|$)''',
  '''^\.release-work([\\/]|$)''',
]

[[allowlists]]
description = "Local runtime diagnostic logs (generated message/trace/device ids, no secrets)"
paths = [
  '''wheelmaker_diag_out\.log$''',
]
