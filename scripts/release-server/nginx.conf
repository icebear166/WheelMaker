server {
    listen 80;
    listen [::]:80;
    server_name release.wheelmaker.top;
    root /srv/wheelmaker-release/public;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name release.wheelmaker.top;
    root /srv/wheelmaker-release/public;
    index index.html;
    autoindex off;

    ssl_certificate /etc/letsencrypt/live/release.wheelmaker.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/release.wheelmaker.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /api/ {
        client_max_body_size 2g;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://127.0.0.1:9680;
    }

    location = /healthz {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:9680;
    }

    location = /release-home.js {
        limit_except GET { deny all; }
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ^~ /releases/ {
        limit_except GET { deny all; }
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~ ^/(stable|publish-status|releases)\.json$ {
        limit_except GET { deny all; }
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~ ^/deploy(-core)?\.mjs$ {
        limit_except GET { deny all; }
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        limit_except GET { deny all; }
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri $uri/ =404;
    }
}
